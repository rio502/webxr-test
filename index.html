<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>真實 3D 表面積計算 (無縫塗色版)</title>
    
    <!-- 引入外部樣式表 -->
    <link rel="stylesheet" href="css/style.css">

    <!-- 引入 A-Frame 與相關套件 -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://unpkg.com/super-hands@3.0.3/dist/super-hands.min.js"></script>

    <!-- 引入拆分的 A-Frame 元件 -->
    <script src="js/components/hybrid-locomotion.js"></script>
    <script src="js/components/laser-pen-behavior.js"></script>
    
    <!-- 引入主程式邏輯 -->
    <script src="js/main.js" defer></script>
</head>
<body>
    <div id="ui-layer">
        <h2 style="margin-top: 0; margin-bottom: 15px; font-size: 24px; letter-spacing: 1px;">真實 3D 表面積計算 (Raycasting)</h2>
        
        <p style="line-height: 1.7; font-size: 16px; margin: 0 0 15px 0;">
           <b>【電腦版操作】</b><br>
           移動：<span style="color: #00FF66; font-weight: bold;">W A S D</span> | 視角：點擊畫面並滑動<br>
           抓取：對準筆按 <span style="color: #00FF66; font-weight: bold;">E</span><br>
           測量：拿起後 <span style="color: #00FF66; font-weight: bold;">長按左鍵</span> 框選物體
        </p>

        <div style="border-top: 1px solid #666; padding-top: 15px; font-size: 16px; line-height: 1.7;">
            <b>提示：</b><br>
            新的算法可完美計算跨越轉角與曲面的真實表面積。<br>
            前方設有：<br>
            <span style="color: #FF4444; font-weight: bold;">格線驗證方塊 (900 cm²/面)</span><br>
            <span style="color: #44CCFF; font-weight: bold;">實體驗證方塊</span><br>
            <span style="color: #FF4444; font-weight: bold;">格線圓柱體 (側邊2827, 總4241 cm²)</span><br>
            <span style="color: #FF99CC; font-weight: bold;">實體圓柱體</span>
        </div>
    </div>

    <div id="area-display">
        塗層表面積:<br><span class="highlight">0 cm²</span>
    </div>

    <div class="custom-vr-btn-container">
        <button id="btn-enter-vr" class="btn-custom btn-vr">進入 VR 模式</button>
        <button id="btn-restart" class="btn-custom btn-restart">重新開始</button>
    </div>

    <a-scene physics="debug: false" webxr="referenceSpaceType: local-floor">
        <a-assets>
            <img id="grid-texture" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI1MTIiIGhlaWdodD0iNTEyIj48cmVjdCB3aWR0aD0iNTEyIiBoZWlnaHQ9IjUxMiIgZmlsbD0iI0ZGRkZGRiIvPjxwYXRoIGQ9Ik0wIDBoNTEydjUxMkgweiIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjMDAwMDAwIiBzdHJva2Utd2lkdGg9IjIiLz48cGF0aCBkPSJNMCA1MS4yaDUxMk0wIDEwMi40aDUxMk0wIDE1My42aDUxMk0wIDIwNC44aDUxMk0wIDI1Nmg1MTJNMCAzMDcuMmg1MTJNMCAzNTguNGg1MTJNMCA0MDkuNmg1MTJNMCA0NjAuOGg1MTJNNTEuMiAwdjUxMk0xMDIuNCAwdjUxMk0xNTMuNiAwdjUxMk0yMDQuOCAwdjUxMk0yNTYgMHY1MTJNMzA3LjIgMHY1MTJNMzU4LjQgMHY1MTJNNDA5LjYgMHY1MTJNNDYwLjggMHY1MTIiIHN0cm9rZT0iI0NDQ0NDQyIgc3Ryb2tlLXdpZHRoPSIzIi8+PC9zdmc+">
            <a-asset-item id="pen-model" src="https://rio502.github.io/webxr-test/assets/LaserPointer.glb"></a-asset-item>
            
            <!-- 載入自訂左右手套模型 -->
            <a-asset-item id="hand-l-model" src="assets/Hand_L.glb"></a-asset-item>
            <a-asset-item id="hand-r-model" src="assets/Hand_R.glb"></a-asset-item>
        </a-assets>

        <a-light type="ambient" color="#444"></a-light>
        <a-light type="directional" position="1 2 1" intensity="0.8" castShadow="true"></a-light>
        <a-sky color="#ECECEC"></a-sky>

        <a-plane position="0 0 0" rotation="-90 0 0" width="20" height="20" color="#7BC8A4" shadow static-body></a-plane>

        <!-- 延長的大桌子 (中央) -->
        <a-box position="1 0.5 -1.5" width="4" height="1" depth="1" color="#8B4513" shadow static-body></a-box>
        <a-box position="-2.5 0.5 -1.5" width="2" height="1" depth="1" color="#5C4033" shadow static-body></a-box>

        <!-- 測試方塊與圓柱體 -->
        <a-entity position="-0.4 1.25 -1.5" rotation="25 35 0">
            <a-box class="target" width="0.3" height="0.3" depth="0.3" color="#FFFFFF" material="src: #grid-texture; repeat: 1 1;" shadow static-body></a-box>
            <a-text value="Reference Cube\nFace Area: 900 cm2" position="0 0.35 0" align="center" width="1.5" color="#FFF"></a-text>
        </a-entity>

        <a-entity position="0.4 1.25 -1.5" rotation="25 35 0">
            <a-box class="target" width="0.3" height="0.3" depth="0.3" color="#4CC3D9" shadow static-body></a-box>
            <a-text value="Target Cube" position="0 0.35 0" align="center" width="1.5" color="#4CC3D9"></a-text>
        </a-entity>
        
        <a-entity position="1.4 1.25 -1.5" rotation="25 -20 15">
            <a-cylinder class="target" radius="0.15" height="0.3" color="#FFFFFF" material="src: #grid-texture; repeat: 2 1;" shadow static-body></a-cylinder>
            <a-text value="Reference Cylinder\nSide: ~2827 cm2\nTotal: ~4241 cm2" position="0 0.4 0" align="center" width="1.5" color="#FFF"></a-text>
        </a-entity>

        <a-entity position="2.2 1.25 -1.5" rotation="25 -20 15">
            <a-cylinder class="target" radius="0.15" height="0.3" color="#FF99CC" shadow static-body></a-cylinder>
            <a-text value="Target Cylinder" position="0 0.4 0" align="center" width="1.5" color="#FF99CC"></a-text>
        </a-entity>

        <a-dodecahedron class="target" position="-2.5 1.3 -1.5" radius="0.4" color="#FFD700" shadow static-body></a-dodecahedron>
        <a-cylinder class="target" position="-1.7 1.3 -1.5" radius="0.3" height="0.6" color="#FF6347" shadow static-body></a-cylinder>

        <!-- 告示牌 -->
        <a-entity position="0 2 -2.5" rotation="0 0 0">
            <a-plane width="2" height="0.6" color="#111" material="opacity: 0.9; transparent: true"></a-plane>
            <a-text id="billboard-text" value="Ready to paint" align="center" width="5" position="0 0 0.01" color="#FFEA00"></a-text>
        </a-entity>

        <!-- 雷射筆 -->
        <a-entity id="laser-pen" class="interactable"
            position="0.5 1.05 -1.3" rotation="-90 0 0" 
            geometry="primitive: box; width: 0.08; height: 0.35; depth: 0.08"
            material="opacity: 0; transparent: true; depthWrite: false"
            dynamic-body="shape: box; mass: 0.5; linearDamping: 0.8; angularDamping: 0.8"
            laser-pen-behavior>
            <a-entity gltf-model="#pen-model" scale="1 1 1" position="0 0 0" rotation="90 0 0"></a-entity>
        </a-entity>
        
        <!-- 玩家 -->
        <a-entity id="rig" position="0 0 0" hybrid-locomotion>
            <a-camera position="0 1.6 0" look-controls="pointerLockEnabled: true" wasd-controls="enabled: false">
                <a-entity id="desktop-cursor"
                          cursor="fuse: false; rayOrigin: entity;"
                          position="0 0 -1"
                          geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025"
                          material="color: white; shader: flat; opacity: 0.5"
                          raycaster="objects: .interactable">
                </a-entity>
            </a-camera>

            <!-- 【成功解法】左手：改用 tracked-controls，徹底避開動畫打架問題 -->
            <a-entity id="left-hand" tracked-controls="hand: left">
                 <!-- 你的專屬左手 -->
                 <a-entity id="custom-hand-l" gltf-model="#hand-l-model"></a-entity>
                 <a-entity class="hand-ray" raycaster="objects: .interactable; showLine: true; far: 5; lineColor: cyan; lineOpacity: 0.5" cursor="rayOrigin: entity" rotation="-45 0 0"></a-entity>
            </a-entity>
            
            <!-- 【成功解法】右手：改用 tracked-controls -->
            <a-entity id="right-hand" tracked-controls="hand: right">
                <!-- 你的專屬右手 -->
                <a-entity id="custom-hand-r" gltf-model="#hand-r-model"></a-entity>
                <a-entity class="hand-ray" raycaster="objects: .interactable; showLine: true; far: 5; lineColor: cyan; lineOpacity: 0.5" cursor="rayOrigin: entity" rotation="-45 0 0"></a-entity>
            </a-entity>
        </a-entity>
        
    </a-scene>
</body>
</html>
